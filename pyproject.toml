[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["ANN", "CPY", "D", "line-too-long", "boolean-positional-value-in-call", "invalid-class-name", "invalid-module-name", "magic-value-comparison", "too-many-boolean-expressions"]
preview = true
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 11
